<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <filter id="planeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Button Shadow -->
  <circle cx="128" cy="136" r="90" fill="#000" opacity="0.15"/>

  <!-- Button -->
  <circle cx="128" cy="128" r="90" fill="url(#btnGrad)" stroke="#FF6F00" stroke-width="3"/>

  <!-- Button Highlight -->
  <path
    d="M58 128 A70 70 0 0 1 198 128"
    fill="none"
    stroke="white"
    stroke-opacity="0.25"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Paper Plane Shadow -->
  <g transform="translate(155 160) scale(2.6) translate(-32 -32)" filter="url(#planeShadow)">
    <polygon fill="#ffffff" points="36 2 2 21 14 23 17 38 21 26 29 32 36 2"/>
  </g>

  <!-- Paper Plane Fold / Gray Shadow -->
  <g transform="translate(155 160) scale(2.6) translate(-32 -32)">
    <polygon fill="#d1d1d1" points="14 23 36 2 21 26 17 38 14 23"/>
  </g>
</svg>